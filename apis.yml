name: Time is Ltd
description: 'Time is Ltd. is a collaboration analytics company that turns workplace
  communication and productivity data into actionable insights for HR, sales, and
  operations teams. Its platform connects to tools such as Google Workspace, Microsoft
  365, Slack, Zoom, Salesforce, Webex, and Tableau to measure meetings, focus time,
  and collaboration patterns, then reports on team performance, employee engagement,
  and revenue outcomes. Backed by Accel and profiled in the API Evangelist network,
  Time is Ltd. exposes no public developer API; integrations are configured through
  its hosted analytics application rather than a documented REST or GraphQL surface.'
